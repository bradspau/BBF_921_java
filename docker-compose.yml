services:

  # ── Standalone profile (default) ─────────────────────────────────────────
  # Runs on port 8000. No resource inventory loaded.
  # Start: docker compose --profile standalone up --build
  app:
    build: .
    ports:
      - "8000:8000"
      - "127.0.0.1:3030:3030"   # embedded Fuseki; only listens if APP_PROFILES includes fuseki
    volumes:
      - tdb2-standalone:/app/tdb2-data
    environment:
      # Add Fuseki:  APP_PROFILES=standalone,fuseki docker compose --profile standalone up
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-standalone}
      INTENT_EVALUATOR: ${INTENT_EVALUATOR:-java}   # java | jena | compare
      INTENT_FUSEKI_LOOPBACK: "false"   # container must bind all interfaces; host side is localhost-only
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [standalone]

  # ── Access profile ────────────────────────────────────────────────────────
  # Runs on port 8001. Loads BBF_access/pon_resource_data.ttl at startup.
  # Start: docker compose --profile access up --build
  app-access:
    build: .
    ports:
      - "8001:8001"
      - "127.0.0.1:3030:3030"   # embedded Fuseki; only listens if APP_PROFILES includes fuseki
    volumes:
      - tdb2-access:/app/tdb2-access
    environment:
      # Add Fuseki:  APP_PROFILES=access,fuseki docker compose --profile access up
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-access}
      INTENT_EVALUATOR: ${INTENT_EVALUATOR:-java}   # java | jena | compare
      INTENT_FUSEKI_LOOPBACK: "false"   # container must bind all interfaces; host side is localhost-only
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [access]

  # ── Aggregation profile ───────────────────────────────────────────────────
  # Multi-domain intent aggregation mode. Runs on port 8000.
  # Start: docker compose --profile aggregation up --build
  app-aggregation:
    build: .
    ports:
      - "8000:8000"
      - "127.0.0.1:3030:3030"   # embedded Fuseki; only listens if APP_PROFILES includes fuseki
    volumes:
      - tdb2-aggregation:/app/tdb2-aggregation
    environment:
      # Add Fuseki:  APP_PROFILES=aggregation,fuseki docker compose --profile aggregation up
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-aggregation}
      INTENT_EVALUATOR: ${INTENT_EVALUATOR:-java}   # java | jena | compare
      INTENT_FUSEKI_LOOPBACK: "false"   # container must bind all interfaces; host side is localhost-only
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: [aggregation]

volumes:
  tdb2-standalone:
  tdb2-access:
  tdb2-aggregation:
